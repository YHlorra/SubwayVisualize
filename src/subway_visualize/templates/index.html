<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轨住图谱</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <h1>轨住图谱</h1>
    <p>选择城市和地铁线路，开始数据抓取与分析</p>
  </header>

  <main class="container">
    <section class="panel">
      <div class="field">
        <label>输入或选择城市</label>
        <input id="cityInput" list="citylist" placeholder="如：济南 或 济南市" />
        <datalist id="citylist"></datalist>
      </div>
      <div class="field">
        <label>地铁线路</label>
        <select id="line"></select>
      </div>
      <div class="field">
        <label>抓取页数</label>
        <input id="pages" type="number" min="1" max="20" value="10" />
      </div>
      <div class="actions">
        <button id="analyzeBtn">开始分析</button>
        <span id="error" class="error" style="display:none"></span>
      </div>
      <div class="help">
        <div>• 选择目标城市与地铁线路</div>
        <div>• 设置抓取页数控制数据量</div>
        <div>• 抓取分析时间根据城市与页数而异，请耐心等待</div>
      </div>
    </section>

    <section class="chart">
        <div class="chartHeader">
          <h2>数据可视化</h2>
          <div class="chartSelect" id="chartSelectWrap">
            <span>选择图表</span>
            <select id="chartSelect" disabled></select>
          </div>
        </div>
      <div id="progress" class="progress" style="display:none"></div>
      <div id="placeholder" class="placeholder">
        <div class="placeholderInner">
          <div class="phTitle">图表容器</div>
          <div class="phDesc">配置参数并开始分析后，数据图表将在此处显示</div>
        </div>
      </div>
      <div id="chartBox" class="chartBox" style="display:none">
        <img id="chartImg" alt="chart" />
        <div class="download">
          <button id="downloadBtn">下载图表</button>
        </div>
      </div>
      <div id="errorDetails" class="output" style="display:none"></div>
    </section>
  </main>

  <script>
    const cityInputEl = document.getElementById('cityInput')
    const cityListEl = document.getElementById('citylist')
    const lineEl = document.getElementById('line')
    const pagesEl = document.getElementById('pages')
    const analyzeBtn = document.getElementById('analyzeBtn')
    const errorEl = document.getElementById('error')
    const chartSelectWrap = document.getElementById('chartSelectWrap')
    const chartSelectEl = document.getElementById('chartSelect')
    const placeholderEl = document.getElementById('placeholder')
    const chartBoxEl = document.getElementById('chartBox')
    const chartImgEl = document.getElementById('chartImg')
    const downloadBtn = document.getElementById('downloadBtn')
    const errorDetails = document.getElementById('errorDetails')

    const citySpellByName = {}
    let currentCitySpell = ''
    let charts = []
    let selectedKey = ''
    let combined = null
    let isLoading = false
    let currentRequestId = 0

    function labelFor(key) {
      const map = { min_top: '最低单价Top', count_top: '房源数Top', avg_price: '平均单价', boxplot: '单价分布', combined: '综合图' }
      return map[key] || key
    }

    async function loadCities() {
      const r = await fetch('/api/cities')
      const list = await r.json()
      cityListEl.innerHTML = ''
      list.forEach(c => {
        const opt = document.createElement('option')
        opt.value = c.name
        citySpellByName[c.name] = c.spell
        cityListEl.appendChild(opt)
      })
      chartSelectEl.innerHTML = ''
      const placeholderOpt = document.createElement('option')
      placeholderOpt.value = ''
      placeholderOpt.textContent = '请选择图表'
      chartSelectEl.appendChild(placeholderOpt)
      chartSelectEl.disabled = true
      chartSelectWrap.style.display = 'flex'
    }

    async function loadLines() {
      errorEl.style.display = 'none'
      if (!(cityInputEl.value && cityInputEl.value.trim())) {
        lineEl.disabled = true
        lineEl.innerHTML = ''
        errorEl.textContent = '请先选择城市'
        errorEl.style.display = 'inline'
        return
      }
      try {
        lineEl.disabled = true
        lineEl.innerHTML = ''
        const syncingOpt = document.createElement('option')
        syncingOpt.value = ''
        syncingOpt.textContent = '同步线路中...'
        lineEl.appendChild(syncingOpt)
        const r = await fetch('/api/subway?city=' + encodeURIComponent(cityInputEl.value))
        const data = await r.json()
        currentCitySpell = data.city_spell || citySpellByName[cityInputEl.value] || ''
        lineEl.innerHTML = ''
        data.lines.forEach(l => {
          const opt = document.createElement('option')
          opt.value = l; opt.textContent = l
          lineEl.appendChild(opt)
        })
        if (data.lines.length) lineEl.value = data.lines[0]
        lineEl.disabled = false
      } catch (e) {
        errorEl.textContent = '获取地铁线路失败'
        errorEl.style.display = 'inline'
        lineEl.disabled = false
      }
    }

    cityInputEl.addEventListener('change', () => {
      if (cityInputEl.value && cityInputEl.value.trim()) {
        loadLines()
      } else {
        lineEl.innerHTML = ''
        lineEl.disabled = true
      }
    })
    cityInputEl.addEventListener('input', () => { errorEl.style.display = 'none' })

    analyzeBtn.addEventListener('click', async () => {
      if (isLoading) return
      document.getElementById('progress').style.display = 'block'
      isLoading = true
      analyzeBtn.disabled = true
      cityInputEl.disabled = true
      lineEl.disabled = true
      errorEl.style.display = 'none'
      charts = []
      chartSelectEl.innerHTML = ''
      const placeholderOpt = document.createElement('option')
      placeholderOpt.value = ''
      placeholderOpt.textContent = '请选择图表'
      chartSelectEl.appendChild(placeholderOpt)
      chartSelectEl.disabled = true
      chartSelectWrap.style.display = 'flex'
      placeholderEl.style.display = 'block'
      chartBoxEl.style.display = 'none'
      errorDetails.style.display = 'none'
      let pollTimer = null
      // 初始状态提示，避免轮询前空白
      errorDetails.textContent = '准备开始分析...'
      errorDetails.style.display = 'block'
      const startPoll = () => {
        if (pollTimer) clearInterval(pollTimer)
        pollTimer = setInterval(async () => {
          try {
            const r2 = await fetch('/api/progress?rid=' + requestId)
            const arr = await r2.json()
            if (Array.isArray(arr) && arr.length) {
              errorDetails.style.display = 'block'
              errorDetails.innerHTML = arr.map(x => x.msg).join(' / ')
            }
          } catch {}
        }, 1000)
      }
      startPoll()
      const requestId = ++currentRequestId
      try {
        if (!(cityInputEl.value && cityInputEl.value.trim())) {
          throw new Error('请选择城市')
        }
        const lineNum = (lineEl.value.match(/\d+/) || [''])[0]
        const r = await fetch('/api/analyze', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city: cityInputEl.value, line: lineNum, pages: Number(pagesEl.value), city_spell: currentCitySpell, request_id: String(requestId) })
        })
        if (!r.ok) {
          const err = await r.json().catch(() => ({}))
          throw new Error(err.error || '分析失败')
        }
        const data = await r.json()
        if (requestId !== currentRequestId) return
        charts = (data.charts || []).filter(c => c.key !== 'combined')
        combined = data.chart_b64 ? { key: 'combined', b64: data.chart_b64, name: data.chart_name } : null
        if (charts.length) {
          chartSelectEl.disabled = false
          charts.forEach(c => {
            const opt = document.createElement('option')
            opt.value = c.key; opt.textContent = labelFor(c.key)
            chartSelectEl.appendChild(opt)
          })
          selectedKey = charts[0].key
          chartSelectEl.value = selectedKey
          const b64 = charts[0].b64
          chartImgEl.src = 'data:image/png;base64,' + b64
          placeholderEl.style.display = 'none'
          chartBoxEl.style.display = 'block'
          errorDetails.style.display = 'none'
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
        } else if (combined) {
          selectedKey = 'combined'
          chartImgEl.src = 'data:image/png;base64,' + combined.b64
          placeholderEl.style.display = 'none'
          chartBoxEl.style.display = 'block'
          errorDetails.style.display = 'none'
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
        }
      } catch (e) {
        const msg = (e && e.message) ? String(e.message) : '分析失败'
        const short = (() => {
          if (msg.includes('未识别到城市代码')) return '城市代码缺失'
          if (msg.includes('城市名称不正确') || msg.includes('未开通地铁')) return '城市无效'
          if (msg.includes('访问过于频繁') || msg.includes('稍后再试')) return '访问过于频繁'
          if (msg.includes('未获取到有效房源数据')) return '暂无数据'
          if (msg.includes('抓取失败')) return '抓取失败'
          if (msg.includes('Failed to fetch')) return '网络错误或服务未启动'
          return '分析失败'
        })()
        const code = (() => {
          if (msg.includes('访问过于频繁')) return 'RATE_LIMIT'
          if (msg.includes('未识别到城市代码')) return 'CITY_CODE'
          if (msg.includes('城市名称不正确') || msg.includes('未开通地铁')) return 'CITY_INVALID'
          if (msg.includes('未获取到有效房源数据')) return 'NO_DATA'
          if (msg.includes('抓取失败')) return 'FETCH_FAIL'
          if (msg.includes('Failed to fetch')) return 'NETWORK'
          return 'UNKNOWN'
        })()
        const suggest = (() => {
          if (code === 'RATE_LIMIT') return '降低抓取页数，间隔几分钟后重试；必要时启用 Firecrawl。'
          if (code === 'CITY_CODE') return '请从城市列表选择城市后再分析，不要输入拼音或缩写。'
          if (code === 'CITY_INVALID') return '请确认城市名称正确且已开通地铁；尝试其他城市。'
          if (code === 'NO_DATA') return '更换线路或减少抓取页数后重试；稍后再试。'
          if (code === 'FETCH_FAIL') return '稍后再试或降低抓取页数；检查网络与访问频率。'
          if (code === 'NETWORK') return '确认后端已启动并可访问 http://127.0.0.1:5000/；检查网络设置。'
          return '请稍后重试，或调整参数后再次分析。'
        })()
        errorEl.textContent = short
        errorEl.style.display = 'inline'
        errorDetails.innerHTML = `状态：${short}<br/>错误代码：${code}<br/>详细信息：${msg}<br/>解决方法：${suggest}`
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
        errorDetails.style.display = 'block'
      } finally {
        document.getElementById('progress').style.display = 'none'
        isLoading = false
        analyzeBtn.disabled = false
        cityInputEl.disabled = false
        lineEl.disabled = false
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
      }
    })

    chartSelectEl.addEventListener('change', () => {
      selectedKey = chartSelectEl.value
      const sel = charts.find(c => c.key === selectedKey)
      if (sel) chartImgEl.src = 'data:image/png;base64,' + sel.b64
    })

    downloadBtn.addEventListener('click', () => {
      let sel = charts.find(c => c.key === selectedKey)
      if (!sel && combined) sel = combined
      if (!sel || !sel.b64) return
      const a = document.createElement('a')
      const name = (sel.name && sel.name.endsWith('.png')) ? sel.name : (sel.name ? (sel.name + '.png') : 'chart.png')
      a.href = 'data:image/png;base64,' + sel.b64
      a.download = name
      document.body.appendChild(a); a.click(); a.remove()
    })

    window.addEventListener('beforeunload', () => {
      try {
        const data = new Blob([JSON.stringify({})], { type: 'application/json' })
        navigator.sendBeacon('/api/cleanup', data)
      } catch (e) {}
    })

    loadCities()
  </script>
</body>
</html>
